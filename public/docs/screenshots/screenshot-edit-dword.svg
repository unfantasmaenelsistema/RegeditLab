<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', Consolas, monospace; }
    </style>
  </defs>

  <!-- Backdrop -->
  <rect width="800" height="460" fill="#0f172a" fill-opacity="0.75" rx="10" />

  <!-- Dialog Container -->
  <rect x="110" y="28" width="580" height="404" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Dialog Title Bar -->
  <path d="M110 34 a6 6 0 0 1 6 -6 h568 a6 6 0 0 1 6 6 v30 h-580 z" fill="#f1f5f9" />
  <line x1="110" y1="64" x2="690" y2="64" stroke="#e2e8f0" />
  <text x="128" y="51" fill="#0284c7" font-size="12" font-weight="700" class="mono">010</text>
  <text x="158" y="51" fill="#0f172a" font-size="12.5" font-weight="700" class="sans">Editar valor DWORD (32 bits)</text>
  <text x="665" y="51" fill="#64748b" font-size="13" font-weight="700" class="sans">✕</text>

  <!-- Path Banner -->
  <rect x="130" y="78" width="540" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="140" y="95" fill="#475569" font-size="11" class="mono">Equipo\HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager\Power</text>

  <!-- Value Name -->
  <text x="130" y="126" fill="#334155" font-size="12" font-weight="600" class="sans">Nombre del valor:</text>
  <rect x="130" y="133" width="540" height="30" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="142" y="152" fill="#0f172a" font-size="12" font-weight="600" class="mono">HiberbootEnabled</text>

  <!-- Value Data & Base -->
  <text x="130" y="186" fill="#334155" font-size="12" font-weight="600" class="sans">Información del valor:</text>
  <rect x="130" y="193" width="310" height="32" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
  <text x="142" y="214" fill="#0f172a" font-size="13" font-weight="700" class="mono">0</text>
  <text x="130" y="242" fill="#64748b" font-size="11" class="mono">Equivalente: 0x00000000 (0)</text>

  <!-- Base Fieldset -->
  <rect x="460" y="178" width="210" height="68" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="472" y="194" fill="#475569" font-size="11" font-weight="600" class="sans">Base</text>
  <circle cx="482" cy="212" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <text x="495" y="216" fill="#334155" font-size="11.5" class="sans">Hexadecimal</text>
  <circle cx="482" cy="232" r="5" fill="#0284c7" stroke="#0284c7" stroke-width="1.5" />
  <text x="495" y="236" fill="#0f172a" font-size="11.5" font-weight="600" class="sans">Decimal</text>

  <!-- Didactic Guide Box -->
  <rect x="130" y="258" width="540" height="118" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="144" y="278" fill="#0f172a" font-size="11.5" font-weight="700" class="sans">ℹ Función en Windows: Controla el Inicio Rápido (Fast Startup / Hiberboot)</text>

  <!-- Option 0 -->
  <rect x="144" y="290" width="512" height="32" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
  <text x="156" y="310" fill="#0369a1" font-size="12" font-weight="700" class="mono">0</text>
  <text x="176" y="310" fill="#0f172a" font-size="11" font-weight="600" class="sans">Desactivar Inicio Rápido (Apagado real limpio, ideal para Dual-Boot Linux)</text>
  <text x="588" y="310" fill="#047857" font-size="11" font-weight="700" class="sans">✓ Seguro</text>

  <!-- Option 1 -->
  <rect x="144" y="328" width="512" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" />
  <text x="156" y="348" fill="#0369a1" font-size="12" font-weight="700" class="mono">1</text>
  <text x="176" y="348" fill="#475569" font-size="11" class="sans">Inicio Rápido habilitado (Hiberna el kernel; bloquea NTFS en Dual-Boot)</text>
  <text x="572" y="348" fill="#b45309" font-size="11" font-weight="600" class="sans">⚠ Precaución</text>

  <!-- Buttons -->
  <rect x="495" y="390" width="84" height="28" rx="4" fill="#0284c7" />
  <text x="516" y="408" fill="#ffffff" font-size="11.5" font-weight="600" class="sans">Aceptar</text>
  <rect x="586" y="390" width="84" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="604" y="408" fill="#334155" font-size="11.5" font-weight="600" class="sans">Cancelar</text>
</svg>
