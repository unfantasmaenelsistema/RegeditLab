  <text x="841" y="221" fill="#475569" font-size="10.5" class="sans">Los drivers del kernel (.sys) son globales para toda la</text>
  <text x="841" y="236" fill="#475569" font-size="10.5" class="sans">máquina en HKLM\SYSTEM\CurrentControlSet\Services.</text>

