  <text x="328" y="535" fill="#0284c7" font-size="11" font-weight="700" class="sans">ℹ Explicación Didáctica de la Clave y Valor Activo (Start)</text>
  <text x="328" y="555" fill="#334155" font-size="11" class="sans">Modo de inicio del driver USBSTOR.SYS en el kernel:</text>
  <text x="328" y="573" fill="#334155" font-size="11" class="sans">• Valor 3 = Manual (Habilitado al conectar un pendrive).</text>
  <text x="328" y="591" fill="#047857" font-size="11" font-weight="600" class="sans">• Valor 4 = Deshabilitado (Bloquea memorias USB manteniendo teclado/ratón).</text>

